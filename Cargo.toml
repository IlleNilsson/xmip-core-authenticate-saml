# Its own workspace root, so this repository builds on its own.
#
# Every module repository carries this and the template did not, which stopped
# mattering the moment the template stopped sitting beside the estate: nested at
# template/rust, cargo walked up, found the root workspace and refused to build.
#
# It would have bitten a generated repository the same way. A template that does
# not obey the estate's rules produces repositories that start out breaking
# them — doc/governance/rust-style.md section 4.
[workspace]

[package]
name = "xmip-core-authenticate-saml"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-authenticate-saml"
description = "Authenticate by saml: verifies an assertion's signature and conditions against the IdP metadata."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): authenticate for the trait and Presented, context
# for Verified, xcore for the mechanism catalog.
authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main" }
# identify for the principal name types: no technology parses a principal
# name itself (ADR-0054).
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
# XML character data, unescaped as every reader in the estate does.
codec = { package = "xmip-core-codec", git = "https://github.com/IlleNilsson/xmip-core-codec", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The assertion arrives as standard base64; the signature is RSA-SHA256 and
# the digest SHA-256; x509-parser reads the IdP certificate's public key and
# nothing else (no chain is verified here).
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
x509-parser = "0.16"

[dev-dependencies]
# The tests mint an IdP key.
rand = "0.8"

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
