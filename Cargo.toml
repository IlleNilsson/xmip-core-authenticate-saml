[package]
name = "xmip-core-authenticate-saml"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authenticate-saml"
description = "Authenticate by saml: verifies an assertion's signature and conditions against the IdP metadata."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): authenticate for the trait and Presented, context
# for Verified, xcore for the mechanism catalog.
authenticate = { workspace = true }
# identify for the principal name types: no technology parses a principal
# name itself (ADR-0054).
identify = { workspace = true }
# The assertion read by the estate's one XML reader (`codec::xml::tree`),
# and the civil calendar a dateTime is read into.
codec = { workspace = true }
context = { workspace = true }
xcore = { workspace = true }
# The assertion arrives as base 64 (codec); the signature is RSA-SHA256 and
# the digest SHA-256.
rsa = { version = "0.9", features = ["sha2"] }
# The estate's one certificate reader (`tls::certificate`), which reads the
# IdP certificate's public key and nothing else (no chain is verified here);
# its PEM is codec's.
tls = { workspace = true }

[dev-dependencies]
# The tests mint an IdP key. rand 0.8, not the newest: rsa 0.9, the newest
# release, draws from rand_core 0.6, the generation rand 0.8 is on.
rand = "0.8"

[lints]
workspace = true
